name: attic deploy

# Reusable: build an app's image in CI, keep a durable copy in GHCR, and push it
# to attic's registry over the tailnet. Attic never pulls from GitHub and holds
# no GitHub credentials.
#
# It lives in this public repo, not in coreyja-studio/infra, because public app
# repos (caje, penpals) can't call reusable workflows from a private repo.
#
# Deploying is then a one-line commit to coreyja-studio/infra pinning the
# digest this job prints (hosts/attic/apps/<app>/compose.yml); infra CI applies
# it. Automating that bump (a GitHub App with contents:write on infra) is a
# later addition, for when something deploys often enough to want it.
#
# Caller, in a coreyja-studio app repo:
#
#   jobs:
#     image:
#       uses: coreyja-studio/.github/.github/workflows/attic-deploy.yml@main
#       with:
#         app: symbols-wtf            # hosts/attic/apps/<app>/ in infra
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#
# Needs variables TS_DEPLOY_OIDC_CLIENT_ID / TS_DEPLOY_OIDC_AUDIENCE in the caller
# (Tailscale trust credential for tag:ci-deploy).

on:
  workflow_call:
    inputs:
      app:
        description: App name, i.e. hosts/attic/apps/<app>/ in coreyja-studio/infra
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to the repo root
        type: string
        default: Dockerfile
      context:
        description: Build context, relative to the repo root
        type: string
        default: .
      build-args:
        description: Extra newline-separated KEY=value build args (GIT_HASH is always passed)
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: attic-deploy-${{ inputs.app }}
      cancel-in-progress: false
    env:
      ATTIC_REGISTRY: attic.rooster-mermaid.ts.net:5000
    steps:
      - uses: actions/checkout@v7

      - name: Names
        id: names
        run: echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR holds the durable copy (attic's registry is lost if the box is
      # rebuilt). provenance/sbom off so the image is one plain manifest whose
      # digest is identical in both registries.
      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.ghcr }}:${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=attic-${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=attic-${{ inputs.app }}

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_OIDC_AUDIENCE }}
          tags: tag:ci-deploy

      - name: Copy to attic's registry
        env:
          SRC: ${{ steps.names.outputs.ghcr }}@${{ steps.build.outputs.digest }}
          DEST: ${{ env.ATTIC_REGISTRY }}/${{ inputs.app }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo copy --preserve-digests \
            --src-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            "docker://${SRC}" "docker://${DEST}"

      - name: Summary
        env:
          APP: ${{ inputs.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GHCR: ${{ steps.names.outputs.ghcr }}
        run: |
          {
            echo "### ${APP}: image ready on attic"
            echo
            echo "To deploy, pin it in coreyja-studio/infra \`hosts/attic/apps/${APP}/compose.yml\`:"
            echo
            echo '```yaml'
            echo "    # ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo "    image: 127.0.0.1:5000/${APP}@${DIGEST}"
            echo '```'
            echo
            echo "Durable copy: \`${GHCR}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
